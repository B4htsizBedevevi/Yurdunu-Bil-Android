name: Android Native CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Build, lint and test
        run: |
          gradle --no-daemon :app:assembleDebug :app:bundleRelease :app:lintDebug :app:testDebugUnitTest

      - name: Name build outputs
        run: |
          mkdir -p app/build/ci-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/ci-artifacts/Yurdunu-Bil-${{ github.sha }}-debug.apk"
          cp app/build/outputs/bundle/release/app-release.aab "app/build/ci-artifacts/Yurdunu-Bil-${{ github.sha }}-release.aab"

      - name: Upload Play-ready artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yurdunu-bil-release-${{ github.sha }}
          if-no-files-found: error
          path: app/build/ci-artifacts/*
