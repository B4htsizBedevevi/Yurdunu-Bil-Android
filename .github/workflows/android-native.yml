name: Android Native CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply latest Arena navigation fix
        shell: python
        run: |
          from pathlib import Path
          import re

          v2 = Path("app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt")
          s = v2.read_text(encoding="utf-8")

          old = '''    if (arenaOpen) {
        BackHandler { arenaOpen = false }
        ArenaRootScreen(darkMode = darkMode, onExit = { arenaOpen = false })
        return
    }'''
          new = '''    if (arenaOpen) {
        // Arena owns its nested back stack. Exiting always returns to Events.
        ArenaRootScreen(
            darkMode = darkMode,
            onExit = {
                arenaOpen = false
                tab = 2
            }
        )
        return
    }'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''                2 -> EventsScreen(darkMode) { mode ->
                    if (mode.arena) arenaOpen = true else startQuiz(mode.title, mode)
                }'''
          new = '''                2 -> EventsScreen(darkMode) { mode ->
                    if (mode.arena) {
                        tab = 2
                        arenaOpen = true
                    } else {
                        startQuiz(mode.title, mode)
                    }
                }'''
          if old in s:
              s = s.replace(old, new, 1)

          v2.write_text(s, encoding="utf-8")

          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          g = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 7', g, count=1)
          g = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.5.2"', g, count=1)
          gradle.write_text(g, encoding="utf-8")

          arena = Path("app/src/main/java/tr/yurdunubil/app/ArenaRootScreen.kt")
          a = arena.read_text(encoding="utf-8")
          if "Exactly one enabled Arena back handler" not in a:
              a = a.replace("    // Keep exactly one enabled back handler for each nested Arena state.", "    // Exactly one enabled Arena back handler is active for each nested state.")
              arena.write_text(a, encoding="utf-8")

      - name: Persist source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt app/src/main/java/tr/yurdunubil/app/ArenaRootScreen.kt app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "fix: finalize Arena navigation and theme behavior"
            git push origin HEAD:main
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare test APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/yurdunu-bil-v0.5.2-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yurdunu-bil-v0.5.2-test
          path: app/build/outputs/apk/debug/yurdunu-bil-v0.5.2-test.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v0.5.2-latest"
          gh release delete "$tag" --yes || true
          git push --delete origin "$tag" || true
          gh release create "$tag" app/build/outputs/apk/debug/yurdunu-bil-v0.5.2-test.apk \
            --title "Yurdunu Bil 0.5.2 — Latest Test APK" \
            --notes "Latest Android test APK for Yurdunu Bil 0.5.2."

      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop tr.yurdunubil.app
            adb logcat -c
            adb shell am start -n tr.yurdunubil.app/.DebugSmokeActivity
            sleep 8
            pid="$(adb shell pidof tr.yurdunubil.app | tr -d '\r')"
            test -n "$pid"
            if adb logcat -d -t 2000 | grep -E "AndroidRuntime|FATAL EXCEPTION|Process: tr.yurdunubil.app"; then exit 1; fi
            echo "V2 smoke test passed: $pid"
