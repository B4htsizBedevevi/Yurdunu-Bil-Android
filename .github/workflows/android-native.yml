name: Android Native CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

env:
  YB_KEYSTORE_BASE64: ${{ secrets.YB_KEYSTORE_BASE64 }}
  YB_KEYSTORE_PASSWORD: ${{ secrets.YB_KEYSTORE_PASSWORD }}
  YB_KEY_ALIAS: ${{ secrets.YB_KEY_ALIAS }}
  YB_KEY_PASSWORD: ${{ secrets.YB_KEY_PASSWORD }}
  YB_GOOGLE_SERVICES_JSON: ${{ secrets.YB_GOOGLE_SERVICES_JSON }}

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Firebase Android config
        shell: bash
        run: |
          if [[ -z "$YB_GOOGLE_SERVICES_JSON" ]]; then
            echo "::error::YB_GOOGLE_SERVICES_JSON secret is required for Firebase/FCM builds."
            exit 1
          fi
          printf '%s' "$YB_GOOGLE_SERVICES_JSON" > app/google-services.json
          test -s app/google-services.json
          echo "Firebase Android config prepared."

      - name: Compile Kotlin
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:compileDebugKotlin --stacktrace 2>&1 | tee "$RUNNER_TEMP/compile-kotlin.log"

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yurdunu-bil-compiler-diagnostics
          path: ${{ runner.temp }}/compile-kotlin.log
          if-no-files-found: warn

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: yurdunu-bil-v0.6.3-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release signing when configured
        shell: bash
        run: |
          if [[ -n "$YB_KEYSTORE_BASE64" && -n "$YB_KEYSTORE_PASSWORD" && -n "$YB_KEY_ALIAS" && -n "$YB_KEY_PASSWORD" ]]; then
            echo "$YB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yurdunu-bil-release.jks"
            echo "YB_KEYSTORE_FILE=$RUNNER_TEMP/yurdunu-bil-release.jks" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "Release signing secrets not configured; building unsigned release AAB."
          fi

      - name: Build release AAB
        run: gradle --no-daemon :app:bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: yurdunu-bil-v0.6.3-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Triggered by a repository commit so the APK artifact is produced for testing.
