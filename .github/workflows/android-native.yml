name: Android Native CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair V2 Kotlin syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt")
          s = p.read_text(encoding="utf-8")
          marker = "// V2 syntax repair applied"
          if marker not in s:
              p.write_text(s.rstrip() + "\n}\n" + marker + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt; then
            git add app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt
            git commit -m "fix: close V2 composable syntax"
            git push origin HEAD:main
          fi

      - name: Wire achievement milestones
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt")
          s = p.read_text(encoding="utf-8")
          marker = "AchievementCard(prefs.getInt(\"solved\", 0), prefs.getInt(\"xp\", 0), prefs.getInt(\"streak\", 0), darkMode)"
          if marker not in s:
              needle = 'item { Card(Modifier.fillMaxWidth(), RoundedCornerShape(17.dp), colors = CardDefaults.cardColors(containerColor = soft))'
              if needle not in s:
                  raise SystemExit("Settings tip card insertion point not found")
              s = s.replace(needle, 'item { AchievementCard(prefs.getInt("solved", 0), prefs.getInt("xp", 0), prefs.getInt("streak", 0), darkMode) }; ' + needle, 1)
              p.write_text(s, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt; then
            git add app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt
            git commit -m "feat: show achievement milestones in settings"
            git push origin HEAD:main
          fi

      - name: Wire online Arena into Events
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt")
          s = p.read_text(encoding="utf-8")
          start = s.find("@Composable private fun EventsScreen")
          end = s.find("@Composable private fun GameCard", start)
          if start < 0 or end < 0:
              raise SystemExit("EventsScreen/GameCard markers not found")
          old = s[start:end]
          if "OnlineArenaScreen(" in old:
              raise SystemExit(0)
          new = '''@Composable private fun EventsScreen(darkMode: Boolean, onLaunch: (SharedGameMode) -> Unit) {
    var onlineMode by remember { mutableStateOf<SharedGameMode?>(null) }
    if (onlineMode != null) {
        OnlineArenaScreen(darkMode, onlineMode!!, onBack = { onlineMode = null }, onMatched = { })
        return
    }
    val text = if (darkMode) DarkText else LightText
    val muted = if (darkMode) DarkMuted else LightMuted
    val surface = if (darkMode) DarkSurface else LightSurface
    LazyColumn(Modifier.fillMaxSize(), contentPadding = PaddingValues(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
        item {
            Card(Modifier.fillMaxWidth().clickable { onlineMode = SharedGameModes.duel }, RoundedCornerShape(20.dp), colors = CardDefaults.cardColors(containerColor = surface)) {
                Row(Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                    Box(Modifier.size(50.dp).clip(RoundedCornerShape(15.dp)).background(Green.copy(alpha = .13f)), contentAlignment = Alignment.Center) { Text("🌐", fontSize = 24.sp) }
                    Spacer(Modifier.width(11.dp))
                    Column(Modifier.weight(1f)) {
                        Text("ONLINE ARENA", color = Green, fontSize = 9.sp, fontWeight = FontWeight.Black)
                        Text("İki cihazda 1v1 oyna", color = text, fontSize = 15.sp, fontWeight = FontWeight.Black)
                        Text("Gerçek oyuncuya karşı eşleş ve yarış.", color = muted, fontSize = 10.sp)
                    }
                    Text("BAŞLA →", color = Green, fontSize = 9.sp, fontWeight = FontWeight.Black)
                }
            }
        }
        item { Text("Oyunlar", color = text, fontSize = 17.sp, fontWeight = FontWeight.Black) }
        items((SharedGameModes.games + SharedGameModes.arenaModes).distinctBy { it.id }, key = { it.id }) { mode -> GameCard(mode, darkMode) { onLaunch(mode) } }
    }
}

'''
          p.write_text(s[:start] + new + s[end:], encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt; then
            git add app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt
            git commit -m "feat: connect online arena to events"
            git push origin HEAD:main
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Preflight Kotlin compile
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare test APK name
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/yurdunu-bil-v0.5.0-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yurdunu-bil-v0.5.0-test
          path: app/build/outputs/apk/debug/yurdunu-bil-v0.5.0-test.apk

      - name: Android emulator startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear tr.yurdunubil.app
            adb shell am force-stop tr.yurdunubil.app
            adb logcat -c
            echo "=== LAUNCHER SMOKE TEST ==="
            adb shell am start -n tr.yurdunubil.app/.ModernLaunchActivity
            sleep 8
            pid="$(adb shell pidof tr.yurdunubil.app | tr -d '\r')"
            test -n "$pid"
            echo "Launcher process alive: $pid"
            if adb logcat -d -t 1200 | grep -E "AndroidRuntime|FATAL EXCEPTION|Process: tr.yurdunubil.app"; then exit 1; fi
            echo "=== AUTH SCREEN SMOKE TEST ==="
            adb shell am force-stop tr.yurdunubil.app
            adb logcat -c
            adb shell am start -n tr.yurdunubil.app/.ModernAuthActivity --ez register true
            sleep 5
            pid="$(adb shell pidof tr.yurdunubil.app | tr -d '\r')"
            test -n "$pid"
            echo "Auth process alive: $pid"
            if adb logcat -d -t 1600 | grep -E "AndroidRuntime|FATAL EXCEPTION|Process: tr.yurdunubil.app"; then exit 1; fi
            echo "=== V2 MAIN SMOKE TEST ==="
            adb shell am force-stop tr.yurdunubil.app
            adb logcat -c
            adb shell am start -n tr.yurdunubil.app/.DebugSmokeActivity
            sleep 8
            pid="$(adb shell pidof tr.yurdunubil.app | tr -d '\r')"
            test -n "$pid"
            echo "V2 process alive: $pid"
            if adb logcat -d -t 2000 | grep -E "AndroidRuntime|FATAL EXCEPTION|Process: tr.yurdunubil.app"; then exit 1; fi
