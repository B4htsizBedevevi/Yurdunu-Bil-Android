name: Android Native CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YB_KEYSTORE_BASE64: ${{ secrets.YB_KEYSTORE_BASE64 }}
      YB_KEYSTORE_PASSWORD: ${{ secrets.YB_KEYSTORE_PASSWORD }}
      YB_KEY_ALIAS: ${{ secrets.YB_KEY_ALIAS }}
      YB_KEY_PASSWORD: ${{ secrets.YB_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yurdunu-bil-v0.5.4-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release signing when configured
        shell: bash
        run: |
          if [[ -n "$YB_KEYSTORE_BASE64" && -n "$YB_KEYSTORE_PASSWORD" && -n "$YB_KEY_ALIAS" && -n "$YB_KEY_PASSWORD" ]]; then
            echo "$YB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yurdunu-bil-release.jks"
            echo "YB_KEYSTORE_FILE=$RUNNER_TEMP/yurdunu-bil-release.jks" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "Release signing secrets not configured; building unsigned release AAB."
          fi

      - name: Build release AAB
        run: gradle --no-daemon :app:bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: yurdunu-bil-v0.5.4-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
