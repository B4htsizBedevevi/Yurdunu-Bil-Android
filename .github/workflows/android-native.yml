name: Android Native CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

env:
  YB_KEYSTORE_BASE64: ${{ secrets.YB_KEYSTORE_BASE64 }}
  YB_KEYSTORE_PASSWORD: ${{ secrets.YB_KEYSTORE_PASSWORD }}
  YB_KEY_ALIAS: ${{ secrets.YB_KEY_ALIAS }}
  YB_KEY_PASSWORD: ${{ secrets.YB_KEY_PASSWORD }}
  YB_GOOGLE_SERVICES_JSON: ${{ secrets.YB_GOOGLE_SERVICES_JSON }}

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Show Android signing fingerprints
        if: env.YB_KEYSTORE_BASE64 != '' && env.YB_KEYSTORE_PASSWORD != '' && env.YB_KEY_ALIAS != '' && env.YB_KEY_PASSWORD != ''
        shell: bash
        run: |
          gradle --no-daemon :app:signingReport

      - name: Prepare Firebase Android config
        shell: bash
        run: |
          if [[ -z "$YB_GOOGLE_SERVICES_JSON" ]]; then
            echo "::error::YB_GOOGLE_SERVICES_JSON secret is required for Firebase/FCM builds."
            exit 1
          fi
          printf '%s' "$YB_GOOGLE_SERVICES_JSON" > app/google-services.json
          test -s app/google-services.json
          echo "Firebase Android config prepared."

      - name: Compile Kotlin
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:compileDebugKotlin --stacktrace 2>&1 | tee "$RUNNER_TEMP/compile-kotlin.log"

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yurdunu-bil-compiler-diagnostics-v0.7.0
          path: ${{ runner.temp }}/compile-kotlin.log
          if-no-files-found: warn

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: yurdunu-bil-v0.7.0-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Check release signing
        id: release_signing
        shell: bash
        run: |
          if [[ -n "$YB_KEYSTORE_BASE64" && -n "$YB_KEYSTORE_PASSWORD" && -n "$YB_KEY_ALIAS" && -n "$YB_KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured; skipping AAB build. Debug APK remains available."
          fi

      - name: Prepare release signing
        if: steps.release_signing.outputs.available == 'true'
        shell: bash
        run: |
          echo "$YB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yurdunu-bil-release.jks"
          test -s "$RUNNER_TEMP/yurdunu-bil-release.jks"
          echo "YB_KEYSTORE_FILE=$RUNNER_TEMP/yurdunu-bil-release.jks" >> "$GITHUB_ENV"
          echo "Release signing configured."

      - name: Build release AAB
        if: steps.release_signing.outputs.available == 'true'
        run: gradle --no-daemon :app:bundleRelease

      - name: Verify release AAB is signed
        if: steps.release_signing.outputs.available == 'true'
        shell: bash
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/aab-signature.txt"
          grep -q "jar verified" "$RUNNER_TEMP/aab-signature.txt"
          echo "Release AAB signature verified."

      - name: Upload release AAB
        if: steps.release_signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: yurdunu-bil-v0.7.0-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Triggered by a repository commit so the APK artifact is produced for testing.
