name: Android Native CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Polish auth startup flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/tr/yurdunubil/app/LaunchActivity.kt")
          s = p.read_text(encoding="utf-8")
          marker = "// Auth startup polish applied"
          if marker not in s:
              s = s.replace(
                  'setContent { LaunchGate(onReady = ::openApp) }',
                  'setContent { LaunchGate(onReady = ::openApp, initialMode = intent.getBooleanExtra("register", false)) }',
                  1
              )
              s = s.replace(
                  'private fun LaunchGate(onReady: () -> Unit) {',
                  'private fun LaunchGate(onReady: () -> Unit, initialMode: Boolean) {',
                  1
              )
              s = s.replace(
                  'var loading by remember { mutableStateOf(true) }',
                  'var loading by remember { mutableStateOf(false) }',
                  1
              )
              s = s.replace(
                  'var authMode by remember { mutableStateOf(false) }',
                  'var authMode by remember { mutableStateOf(initialMode) }',
                  1
              )
              s = s.replace('        delay(180)\n', '', 1)
          # Critical session fix: wait for the Auth plugin to restore its saved session.
          s = s.replace(
              '    LaunchedEffect(Unit) {\n        val current = SupabaseClientProvider.client.auth.currentSessionOrNull()',
              '    LaunchedEffect(Unit) {\n        SupabaseClientProvider.client.auth.awaitInitialization()\n        val current = SupabaseClientProvider.client.auth.currentSessionOrNull()',
              1
          )
          p.write_text(s.rstrip() + "\n" + marker + "\n", encoding="utf-8")

          # Make Supabase mobile session persistence explicit.
          p = Path("app/src/main/java/tr/yurdunubil/app/SupabaseClient.kt")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              '            flowType = FlowType.PKCE\n            scheme = "yurdunubil"',
              '            flowType = FlowType.PKCE\n            autoLoadFromStorage = true\n            autoSaveToStorage = true\n            alwaysAutoRefresh = true\n            scheme = "yurdunubil"',
              1
          )
          p.write_text(s, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app/src/main/java/tr/yurdunubil/app/LaunchActivity.kt app/src/main/java/tr/yurdunubil/app/SupabaseClient.kt; then
            git add app/src/main/java/tr/yurdunubil/app/LaunchActivity.kt app/src/main/java/tr/yurdunubil/app/SupabaseClient.kt
            git commit -m "fix: persist auth session across app restarts"
            git push origin HEAD:main
          fi

      - name: Repair V2 Kotlin syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt")
          s = p.read_text(encoding="utf-8")
          marker = "// V2 syntax repair applied"
          if marker not in s:
              p.write_text(s.rstrip() + "\n}\n" + marker + "\n", encoding="utf-8")

          # Central preference store + child-first BackHandlers.
          s = p.read_text(encoding="utf-8")
          s = s.replace('val prefs = remember { context.getSharedPreferences("yurdunu_bil_native", 0) }', 'val prefs = remember { YBPreferences.get(context) }', 1)
          s = s.replace('SettingsScreen(prefs, darkMode) { prefs.edit().putBoolean("dark_mode", it).apply(); darkMode = it }', 'SettingsScreen(prefs, darkMode) { YBPreferences.setDarkMode(prefs, it); darkMode = it }', 1)
          old = '''    BackHandler {
        when {
            quiz != null -> quiz = null
            study != null -> study = null
            province != null -> province = null
            arenaOpen -> arenaOpen = false
            tab != 0 -> tab = 0
            else -> showExitDialog = true
        }
    }'''
          new = '''    BackHandler(enabled = quiz == null && study == null && province == null && !arenaOpen && !showExitDialog) {
        if (tab != 0) tab = 0 else showExitDialog = true
    }'''
          s = s.replace(old, new, 1)
          for old, new in [
              ('    if (study != null) {\n        val selected = study!!', '    if (study != null) {\n        BackHandler { study = null }\n        val selected = study!!'),
              ('    if (province != null) {\n        ProvinceDetailScreen', '    if (province != null) {\n        BackHandler { province = null }\n        ProvinceDetailScreen'),
              ('    if (arenaOpen) {\n        ArenaRootScreen', '    if (arenaOpen) {\n        BackHandler { arenaOpen = false }\n        ArenaRootScreen'),
              ('    if (quiz != null) {\n        V2QuizScreen', '    if (quiz != null) {\n        BackHandler { quiz = null }\n        V2QuizScreen')
          ]:
              if old in s and new not in s:
                  s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt; then
            git add app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt
            git commit -m "fix: harden V2 back navigation and preferences"
            git push origin HEAD:main
          fi

      - name: Wire achievement milestones
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt")
          s = p.read_text(encoding="utf-8")
          marker = "AchievementCard(prefs.getInt(\"solved\", 0), prefs.getInt(\"xp\", 0), prefs.getInt(\"streak\", 0), darkMode)"
          if marker not in s:
              needle = 'item { Card(Modifier.fillMaxWidth(), RoundedCornerShape(17.dp), colors = CardDefaults.cardColors(containerColor = soft))'
              if needle not in s:
                  raise SystemExit("Settings tip card insertion point not found")
              s = s.replace(needle, 'item { AchievementCard(prefs.getInt("solved", 0), prefs.getInt("xp", 0), prefs.getInt("streak", 0), darkMode) }; ' + needle, 1)
              p.write_text(s, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt; then
            git add app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt
            git commit -m "feat: show achievement milestones in settings"
            git push origin HEAD:main
          fi

      - name: Wire dedicated Arena and richer home
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt")
          s = p.read_text(encoding="utf-8")
          marker = "// Dedicated Arena wiring applied"
          if marker in s:
              raise SystemExit(0)

          replacements = [
              (
                  'var quizMode by remember { mutableStateOf(SharedGameModes.quick) }\n    var showExitDialog by remember { mutableStateOf(false) }',
                  'var quizMode by remember { mutableStateOf(SharedGameModes.quick) }\n    var arenaOpen by remember { mutableStateOf(false) }\n    var showExitDialog by remember { mutableStateOf(false) }'
              ),
              (
                  '            province != null -> province = null\n            tab != 0 -> tab = 0',
                  '            province != null -> province = null\n            arenaOpen -> arenaOpen = false\n            tab != 0 -> tab = 0'
              ),
              (
                  '    if (quiz != null) {\n        V2QuizScreen(quizTitle, quizMode, quiz!!, prefs, darkMode) { quiz = null }\n        return\n    }',
                  '    if (arenaOpen) {\n        ArenaRootScreen(darkMode = darkMode, onExit = { arenaOpen = false })\n        return\n    }\n    if (quiz != null) {\n        V2QuizScreen(quizTitle, quizMode, quiz!!, prefs, darkMode) { quiz = null }\n        return\n    }'
              ),
              (
                  '                0 -> HomeScreen(prefs, darkMode, { startQuiz("Hızlı 10", SharedGameModes.quick) }, { startQuiz(SharedQuestionPool.dailyMode().title, SharedQuestionPool.dailyMode()) }, { tab = 2 }, { tab = 1 })',
                  '                0 -> HomeScreen(prefs, darkMode, { startQuiz("Hızlı 10", SharedGameModes.quick) }, { startQuiz(SharedQuestionPool.dailyMode().title, SharedQuestionPool.dailyMode()) }, { tab = 2; arenaOpen = true }, { tab = 1 })'
              ),
              (
                  '                2 -> EventsScreen(darkMode) { startQuiz(it.title, it) }',
                  '                2 -> { arenaOpen = true }'
              ),
              (
                  '        item { LastActivityCard(prefs, darkMode) }',
                  '        item { LastActivityCard(prefs, darkMode) }\n        item { HomePulseCard(prefs, darkMode, quick, events, library) }'
              )
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"Arena/home replacement target not found: {old[:80]}")
              s = s.replace(old, new, 1)

          p.write_text(s.rstrip() + "\n" + marker + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt; then
            git add app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt
            git commit -m "feat: route Arena separately and enrich home"
            git push origin HEAD:main
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Preflight Kotlin compile
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare test APK name
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/yurdunu-bil-v0.5.0-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yurdunu-bil-v0.5.0-test
          path: app/build/outputs/apk/debug/yurdunu-bil-v0.5.0-test.apk

      - name: Android emulator startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear tr.yurdunubil.app
            adb shell am force-stop tr.yurdunubil.app
            adb logcat -c
            echo "=== LAUNCHER SMOKE TEST ==="
            adb shell am start -n tr.yurdunubil.app/.ModernLaunchActivity
            sleep 8
            pid="$(adb shell pidof tr.yurdunubil.app | tr -d '\r')"
            test -n "$pid"
            echo "Launcher process alive: $pid"
            if adb logcat -d -t 1200 | grep -E "AndroidRuntime|FATAL EXCEPTION|Process: tr.yurdunubil.app"; then exit 1; fi
            echo "=== AUTH SCREEN SMOKE TEST ==="
            adb shell am force-stop tr.yurdunubil.app
            adb logcat -c
            adb shell am start -n tr.yurdunubil.app/.ModernAuthActivity --ez register true
            sleep 5
            pid="$(adb shell pidof tr.yurdunubil.app | tr -d '\r')"
            test -n "$pid"
            echo "Auth process alive: $pid"
            if adb logcat -d -t 1600 | grep -E "AndroidRuntime|FATAL EXCEPTION|Process: tr.yurdunubil.app"; then exit 1; fi
            echo "=== V2 MAIN SMOKE TEST ==="
            adb shell am force-stop tr.yurdunubil.app
            adb logcat -c
            adb shell am start -n tr.yurdunubil.app/.DebugSmokeActivity
            sleep 8
            pid="$(adb shell pidof tr.yurdunubil.app | tr -d '\r')"
            test -n "$pid"
            echo "V2 process alive: $pid"
            if adb logcat -d -t 2000 | grep -E "AndroidRuntime|FATAL EXCEPTION|Process: tr.yurdunubil.app"; then exit 1; fi
