name: Android Native CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

env:
  YB_KEYSTORE_BASE64: ${{ secrets.YB_KEYSTORE_BASE64 }}
  YB_KEYSTORE_PASSWORD: ${{ secrets.YB_KEYSTORE_PASSWORD }}
  YB_KEY_ALIAS: ${{ secrets.YB_KEY_ALIAS }}
  YB_KEY_PASSWORD: ${{ secrets.YB_KEY_PASSWORD }}
  YB_FIREBASE_CONFIG_JSON: ${{ secrets.YB_FIREBASE_CONFIG_JSON }}

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Firebase Android app
        shell: bash
        run: |
          if [[ -n "$YB_FIREBASE_CONFIG_JSON" ]]; then
            printf '%s' "$YB_FIREBASE_CONFIG_JSON" > app/google-services.json
            echo "Firebase Android configuration injected."
          else
            echo "Firebase Android configuration is not configured; building without FCM runtime registration."
          fi

      - name: Activate modern home UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/tr/yurdunubil/app/ModernMainV4.kt")
          text = path.read_text(encoding="utf-8")
          old = '0 -> HomeV4(p, prefs, { launchQuiz("Hızlı 10", SharedGameModes.quick) }) { arenaOpen = true };'
          new = '0 -> HomeModernV5(p.bg, p.card, p.text, p.muted, p.green, p.gold, prefs, { launchQuiz("Hızlı 10", SharedGameModes.quick) }, { arenaOpen = true }, { context.startActivity(android.content.Intent(context, SocialModernActivity::class.java)) });'
          if old not in text:
              raise SystemExit("Modern home call pattern not found; refusing to build a mismatched UI")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("Modern home UI activated.")
          PY

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: yurdunu-bil-v0.7.3-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release signing when configured
        shell: bash
        run: |
          if [[ -n "$YB_KEYSTORE_BASE64" && -n "$YB_KEYSTORE_PASSWORD" && -n "$YB_KEY_ALIAS" && -n "$YB_KEY_PASSWORD" ]]; then
            echo "$YB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yurdunu-bil-release.jks"
            echo "YB_KEYSTORE_FILE=$RUNNER_TEMP/yurdunu-bil-release.jks" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "Release signing secrets not configured; building unsigned release AAB."
          fi

      - name: Build release AAB
        run: gradle --no-daemon :app:bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: yurdunu-bil-v0.7.3-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
