name: Android Native CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare 0.5.4 APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/yurdunu-bil-v0.5.4-test.apk

      - name: Upload 0.5.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: yurdunu-bil-v0.5.4-test
          path: app/build/outputs/apk/debug/yurdunu-bil-v0.5.4-test.apk
          if-no-files-found: error
