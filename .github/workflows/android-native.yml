name: Android Native CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Preflight Kotlin compile
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare test APK name
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/yurdunu-bil-v0.4.0-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yurdunu-bil-v0.4.0-test
          path: app/build/outputs/apk/debug/yurdunu-bil-v0.4.0-test.apk

      - name: Android emulator startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear tr.yurdunubil.app
            adb shell am force-stop tr.yurdunubil.app
            adb logcat -c

            echo "=== LAUNCHER SMOKE TEST ==="
            adb shell am start -n tr.yurdunubil.app/.ModernLaunchActivity
            sleep 8
            echo "--- LAUNCHER PROCESS ---"
            pid="$(adb shell pidof tr.yurdunubil.app | tr -d '\r')"
            test -n "$pid"
            echo "Launcher process alive: $pid"
            echo "--- LAUNCHER CRASH/EXCEPTION LOGCAT ---"
            if adb logcat -d -t 1200 | grep -E "AndroidRuntime|FATAL EXCEPTION|Process: tr.yurdunubil.app"; then
              echo "Launcher exception detected"
              exit 1
            fi

            echo "=== AUTH SCREEN SMOKE TEST ==="
            adb shell am force-stop tr.yurdunubil.app
            adb logcat -c
            adb shell am start -n tr.yurdunubil.app/.ModernAuthActivity --ez register true
            sleep 5
            pid="$(adb shell pidof tr.yurdunubil.app | tr -d '\r')"
            test -n "$pid"
            echo "Auth process alive: $pid"
            if adb logcat -d -t 1600 | grep -E "AndroidRuntime|FATAL EXCEPTION|Process: tr.yurdunubil.app"; then
              echo "Auth exception detected"
              exit 1
            fi

            echo "=== V2 MAIN SMOKE TEST ==="
            adb shell am force-stop tr.yurdunubil.app
            adb logcat -c
            adb shell am start -n tr.yurdunubil.app/.DebugSmokeActivity
            sleep 8
            echo "--- V2 PROCESS ---"
            pid="$(adb shell pidof tr.yurdunubil.app | tr -d '\r')"
            test -n "$pid"
            echo "V2 process alive: $pid"
            echo "--- V2 CRASH/EXCEPTION LOGCAT ---"
            if adb logcat -d -t 2000 | grep -E "AndroidRuntime|FATAL EXCEPTION|Process: tr.yurdunubil.app"; then
              echo "V2 exception detected"
              exit 1
            fi
