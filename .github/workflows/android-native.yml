name: Android Native CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yurdunu-bil-v0.5.4-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build release AAB
        run: gradle --no-daemon :app:bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: yurdunu-bil-v0.5.4-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
