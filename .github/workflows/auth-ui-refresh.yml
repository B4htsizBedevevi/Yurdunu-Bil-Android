name: Auth UI Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh auth presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/tr/yurdunubil/app/LaunchActivity.kt')
          s = p.read_text(encoding='utf-8')
          if '// AUTH PRESENTATION V2' in s:
              raise SystemExit(0)
          replacements = {
              'Text("Geleceğini Bil.", color = Accent, fontSize = 13.sp, fontWeight = FontWeight.Bold)': 'Text("Türkiye\'yi öğren. Hedefini büyüt.", color = Accent, fontSize = 12.sp, fontWeight = FontWeight.Bold)',
              'Text("KPSS • TÜRKİYE COĞRAFYASI", color = AccentSoft, fontSize = 8.sp, fontWeight = FontWeight.Black, letterSpacing = .8.sp)': 'Text("KPSS • TÜRKİYE COĞRAFYASI • YENİ NESİL", color = AccentSoft, fontSize = 8.sp, fontWeight = FontWeight.Black, letterSpacing = .65.sp)',
              'shape = RoundedCornerShape(28.dp),': 'shape = RoundedCornerShape(30.dp),',
              'modifier = Modifier.fillMaxWidth().height(57.dp),': 'modifier = Modifier.fillMaxWidth().height(60.dp),',
              'Text(if (mode) "Hesabımı Oluştur" else "Giriş Yap", fontSize = 16.sp, fontWeight = FontWeight.ExtraBold)': 'Text(if (mode) "Haritaya Katıl" else "Devam Et", fontSize = 16.sp, fontWeight = FontWeight.ExtraBold)',
              'Text("Türkiye\'yi öğren • Kendini geliştir • Hedefine ilerle", color = Muted, fontSize = 11.sp)': 'Text("Türkiye\'yi öğren • Test çöz • Arena\'da yarış", color = Muted, fontSize = 11.sp)'
          }
          for old, new in replacements.items():
              s = s.replace(old, new, 1)
          s = s.replace('\n}\n\nprivate suspend fun performAuth', '\n}\n\n// AUTH PRESENTATION V2\n\nprivate suspend fun performAuth', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/tr/yurdunubil/app/LaunchActivity.kt
          git commit -m 'feat: refresh authentication presentation'
          git push origin HEAD:main
