name: Force Finalize
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final auth and navigation fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed=False
          p=Path('app/src/main/java/tr/yurdunubil/app/LaunchActivity.kt'); s=p.read_text()
          if '// FINAL_AUTH_SESSION' not in s:
            s=s.replace('import io.github.jan.supabase.auth.providers.builtin.Email\n','import io.github.jan.supabase.auth.providers.builtin.Email\nimport io.github.jan.supabase.auth.status.SessionStatus\n').replace('import kotlinx.coroutines.delay\n','import kotlinx.coroutines.delay\nimport kotlinx.coroutines.flow.first\n')
            old='''    LaunchedEffect(Unit) {
        val current = SupabaseClientProvider.client.auth.currentSessionOrNull()
        session = current != null
        if (current != null) {
            profile = loadProfile()
            if (profile?.onboarding_completed == true) onReady()
        }
        loading = false
    }'''
            new='''    LaunchedEffect(Unit) {
        val auth = SupabaseClientProvider.client.auth
        val status = auth.sessionStatus.first { it is SessionStatus.Authenticated || it is SessionStatus.NotAuthenticated || it is SessionStatus.RefreshFailure }
        val current = auth.currentSessionOrNull()
        session = current != null && status !is SessionStatus.NotAuthenticated
        if (current != null && session) {
            profile = loadProfile()
            if (profile?.onboarding_completed == true) onReady()
        }
        loading = false
    }'''
            if old not in s: raise SystemExit('LaunchGate not found')
            p.write_text(s.replace(old,new).rstrip()+'\n// FINAL_AUTH_SESSION\n'); changed=True
          p=Path('app/src/main/java/tr/yurdunubil/app/SupabaseClient.kt'); s=p.read_text()
          if 'autoLoadFromStorage = true' not in s:
            old='''        install(Auth) {
            flowType = FlowType.PKCE
            scheme = "yurdunubil"
            host = "auth"
        }'''
            new='''        install(Auth) {
            flowType = FlowType.PKCE
            autoLoadFromStorage = true
            autoSaveToStorage = true
            alwaysAutoRefresh = true
            scheme = "yurdunubil"
            host = "auth"
        }'''
            if old not in s: raise SystemExit('Auth config not found')
            p.write_text(s.replace(old,new)); changed=True
          p=Path('app/src/main/java/tr/yurdunubil/app/ModernLaunchActivity.kt'); s=p.read_text()
          if '// FINAL_LAUNCH_SESSION' not in s:
            old='startActivity(Intent(this, ModernAuthActivity::class.java).putExtra("register", register))'
            if old not in s: raise SystemExit('legacy auth route not found')
            p.write_text(s.replace(old,'startActivity(Intent(this, LaunchActivity::class.java).putExtra("register", register))').rstrip()+'\n// FINAL_LAUNCH_SESSION\n'); changed=True
          p=Path('app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt'); s=p.read_text()
          if '// FINAL_BACK_SESSION' not in s:
            old='''    BackHandler {
        when {
            quiz != null -> quiz = null
            study != null -> study = null
            province != null -> province = null
            arenaOpen -> arenaOpen = false
            tab != 0 -> tab = 0
            else -> showExitDialog = true
        }
    }'''
            new='''    BackHandler(enabled = quiz == null && study == null && province == null && !arenaOpen && !showExitDialog) {
        if (tab != 0) tab = 0 else showExitDialog = true
    }'''
            if old not in s: raise SystemExit('V2 BackHandler not found')
            s=s.replace(old,new)
            s=s.replace('''    if (study != null) {
        val selected = study!!''','''    if (study != null) {
        BackHandler { study = null }
        val selected = study!!''',1)
            s=s.replace('''    if (province != null) {
        ProvinceDetailScreen''','''    if (province != null) {
        BackHandler { province = null }
        ProvinceDetailScreen''',1)
            s=s.replace('''    if (arenaOpen) {
        ArenaRootScreen''','''    if (arenaOpen) {
        BackHandler { arenaOpen = false }
        ArenaRootScreen''',1)
            s=s.replace('''    if (quiz != null) {
        V2QuizScreen''','''    if (quiz != null) {
        BackHandler { quiz = null }
        V2QuizScreen''',1)
            s=s.replace('val prefs = remember { context.getSharedPreferences("yurdunu_bil_native", 0) }','val prefs = remember { YBPreferences.get(context) }',1)
            s=s.replace('SettingsScreen(prefs, darkMode) { prefs.edit().putBoolean("dark_mode", it).apply(); darkMode = it }','SettingsScreen(prefs, darkMode) { YBPreferences.setDarkMode(prefs, it); darkMode = it }',1)
            p.write_text(s.rstrip()+'\n// FINAL_BACK_SESSION\n'); changed=True
          print('changed',changed)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet; then
            git add app/src/main/java/tr/yurdunubil/app/LaunchActivity.kt app/src/main/java/tr/yurdunubil/app/SupabaseClient.kt app/src/main/java/tr/yurdunubil/app/ModernLaunchActivity.kt app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt
            git commit -m 'fix: finalize auth session and arena back stack'
            git push origin HEAD:main
          fi
