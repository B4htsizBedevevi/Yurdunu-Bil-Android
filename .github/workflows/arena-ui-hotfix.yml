name: Android APK Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize source and version
        shell: python
        run: |
          from pathlib import Path
          import re

          # V2 Arena exit must return to Events and must not reopen itself.
          p = Path("app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt")
          s = p.read_text(encoding="utf-8")

          old = '''    if (arenaOpen) {
        BackHandler { arenaOpen = false }
        ArenaRootScreen(darkMode = darkMode, onExit = { arenaOpen = false })
        return
    }'''
          new = '''    if (arenaOpen) {
        ArenaRootScreen(
            darkMode = darkMode,
            onExit = {
                arenaOpen = false
                tab = 2
            }
        )
        return
    }'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''                2 -> { arenaOpen = true }'''
          new = '''                2 -> EventsScreen(darkMode) { mode ->
                    if (mode.arena) {
                        tab = 2
                        arenaOpen = true
                    } else {
                        startQuiz(mode.title, mode)
                    }
                }'''
          if old in s:
              s = s.replace(old, new, 1)

          # Root back handler is disabled while a nested screen is visible.
          old = '''    BackHandler {
        when {
            quiz != null -> quiz = null
            study != null -> study = null
            province != null -> province = null
            arenaOpen -> arenaOpen = false
            tab != 0 -> tab = 0
            else -> showExitDialog = true
        }
    }'''
          new = '''    BackHandler(enabled = quiz == null && study == null && province == null && !arenaOpen && !showExitDialog) {
        if (tab != 0) tab = 0 else showExitDialog = true
    }'''
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace('val prefs = remember { context.getSharedPreferences("yurdunu_bil_native", 0) }', 'val prefs = remember { YBPreferences.get(context) }', 1)
          s = s.replace('SettingsScreen(prefs, darkMode) { prefs.edit().putBoolean("dark_mode", it).apply(); darkMode = it }', 'SettingsScreen(prefs, darkMode) { YBPreferences.setDarkMode(prefs, it); darkMode = it }', 1)
          p.write_text(s, encoding="utf-8")

          # Ensure Arena's shell compiles and has a real themed background.
          p = Path("app/src/main/java/tr/yurdunubil/app/ArenaRootScreen.kt")
          s = p.read_text(encoding="utf-8")
          if "import androidx.compose.ui.Modifier" not in s:
              s = s.replace("import androidx.compose.runtime.*\n", "import androidx.compose.runtime.*\nimport androidx.compose.ui.Modifier\n", 1)
          p.write_text(s, encoding="utf-8")

          # Version 0.5.2 / versionCode 7.
          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 7', s, count=1)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.5.2"', s, count=1)
          p.write_text(s, encoding="utf-8")

      - name: Persist source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/tr/yurdunubil/app/YurdunuBilMainV2.kt app/src/main/java/tr/yurdunubil/app/ArenaRootScreen.kt app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "fix: finalize Arena navigation and release 0.5.2"
            git push origin HEAD:main
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/yurdunu-bil-v0.5.2-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yurdunu-bil-v0.5.2-test
          path: app/build/outputs/apk/debug/yurdunu-bil-v0.5.2-test.apk
